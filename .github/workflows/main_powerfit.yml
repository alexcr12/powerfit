name: Build and deploy JAR app to Azure Web App - powerfit

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Verificar estructura
        run: |
          pwd
          find . -name pom.xml

      - name: Build with Maven
        run: mvn -f powerfit-gym-main/backend/pom.xml clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'powerfit-gym-main/backend/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_85F4E959A33E40009AF1D51239F04B42 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2829D1D55E174DAB8DD95ECBEC07FB12 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2148FADBA994426B8C2B4134D0A23720 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'powerfit'
          slot-name: 'Production'
          package: '*.jar'
