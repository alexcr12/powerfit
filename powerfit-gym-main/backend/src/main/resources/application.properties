server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:powerfit-gym-clave-del-curso-2026-cambiar-en-produccion-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
membresia.precio=${MEMBRESIA_PRECIO:100.00}
management.endpoints.web.exposure.include=health,metrics,loggers,info
management.endpoint.health.show-details=when-authorized
logging.level.root=INFO
logging.level.com.powerfitgym=INFO

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/powerfit_v2?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
